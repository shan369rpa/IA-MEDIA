# postgresql.conf - CUSTOMIZED FOR IA MEDIA PROJECT
# File này sẽ được copy lên server để cấu hình PostgreSQL

# Cho phép kết nối từ bất kỳ địa chỉ IP nào (quan trọng cho Docker)
listen_addresses = '*'

# Bật logging để dễ dàng gỡ lỗi các vấn đề kết nối
log_connections = on
log_disconnections = on
logging_collector = on
log_destination = 'stderr'
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'